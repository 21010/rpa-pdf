# pyproject.toml

[build-system]
requires = ["setuptools>=63.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "rpa-pdf"
version = "2.0.3"
description = "Comprehensive PDF manipulation and conversion toolkit designed for RPA (Robotic Process Automation) workflows."
readme = "README.md"
authors = [{ name = "Grzegorz Ziolo", email = "grzegorz.ziolo@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["rpa", "pdf"]
dependencies = [
    "pypdf >= 3.15.0",
    "fpdf2 >= 2.7.5",
    "python-barcode >= 0.15.1",
    "Pillow >= 9.1.1",
    "xhtml2pdf >= 0.2.16",
    "extract-msg >= 0.45.0",
    "comtypes>=1.4.16",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/21010/rpa-pdf"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 120

[tool.pyrefly]
strict = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".pytest_cache", ".ruff_cache", "dist"]
